[project]
name = "rclone-tray"
version = "1.0.0"
description = "System tray controller for rclone cloud storage mounts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ishantoz" }]
keywords = ["rclone", "tray", "systemd", "cloud-storage", "mount"]

dependencies = [
    "pygobject>=3.50.0",
]

[project.scripts]
rclone-tray = "rclone_tray.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rclone_tray"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
extraPaths = ["src"]

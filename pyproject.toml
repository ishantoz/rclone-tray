[project]
name = "rclone-tray"
version = "2.0.0"
description = "Cross-platform system tray controller for rclone cloud storage mounts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ishantoz" }]
keywords = ["rclone", "tray", "cloud-storage", "mount", "cross-platform"]

dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
linux = ["PyGObject>=3.50.0"]

[project.scripts]
rclone-tray = "rclone_tray.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rclone_tray"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
extraPaths = ["src"]
